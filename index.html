<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#14181d;--ink2:#4b5563;--mute:#7a8491;--line:#e4e7eb;--bg:#ffffff;--floor:#eceef1;--hall:#ffffff;
  --high:#1b7f4b;--highbg:#a9e3c2;--med:#a86b00;--medbg:#ffd98a;--comp:#b42a22;--compbg:#f5b9b4;--lmt:#1d4ed8;--lmtbg:#c7d7ff;
  --other:#e2e5e9;--otherln:#c3c9d1;--empty:#f4f5f7;--emptyln:#d9dde3;
  --sel:#14181d;--r:14px;--sheet:50vh;--safe:env(safe-area-inset-bottom,0px);
  --font:"Barlow",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--cond:"Barlow Semi Condensed",var(--font);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font:16px/1.35 var(--font);color:var(--ink);background:var(--floor)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ink);text-decoration:underline;text-decoration-color:#b9c0c8;text-underline-offset:2px}
#map{position:absolute;inset:0;background:var(--floor)}
.leaflet-container{font-family:var(--font)}
.leaflet-control-zoom{display:none;border:0!important;box-shadow:0 2px 10px rgba(20,24,29,.12)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important}
.leaflet-control-attribution{font-size:11px;color:var(--mute);background:rgba(255,255,255,.75);padding:2px 6px}
.leaflet-control-attribution a{color:var(--ink2)}
.hall-label{background:transparent;border:0;box-shadow:none;font:700 22px/1 var(--cond);letter-spacing:.08em;color:rgba(20,24,29,.32);pointer-events:none;text-shadow:0 0 6px #fff}
.std-label{background:transparent;border:0;box-shadow:none;font:600 11px/1 var(--cond);color:#2b3440;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.std-label.hi{font-size:12px;color:var(--ink)}

/* top controls (mobile) */
#top{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top,0px));z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;box-shadow:0 2px 12px rgba(20,24,29,.14);padding:0 8px 0 14px;height:48px}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:16px/1 var(--font);color:var(--ink);height:100%}
.search input::placeholder{color:var(--mute)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .x{display:none;width:34px;height:34px;border-radius:50%;color:var(--mute);font-size:18px;line-height:34px;text-align:center}
.search.has .x{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;background:var(--bg);box-shadow:0 1px 6px rgba(20,24,29,.12);font-weight:500;font-size:15px;color:var(--ink2);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);background:transparent}
.chip.on{background:var(--ink);color:#fff}
.chip.on i{background:var(--c)}
.chip.v i{border-color:#b9c0c8}.chip.v.on i{background:#fff;border-color:#fff}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(20,24,29,.14);height:var(--sheet);display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1);touch-action:none;will-change:height}
#sheet.drag{transition:none}
#grip{flex:none;height:22px;display:flex;align-items:center;justify-content:center;cursor:grab}
#grip:before{content:"";width:40px;height:5px;border-radius:3px;background:#d3d8de}
#head{flex:none;padding:0 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font:700 19px/1.2 var(--font);margin:0;letter-spacing:-.01em}
.meta{color:var(--mute);font-size:14px;white-space:nowrap}
#body{flex:1;min-height:0;position:relative;border-top:1px solid var(--line);touch-action:pan-y}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--safe)}
.view[hidden]{display:none}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.row:active{background:#f3f5f7}.row.sel{background:#eef2f6}
.tag{flex:none;font:700 14px/1 var(--cond);letter-spacing:.02em;padding:7px 8px;border-radius:7px;min-width:66px;text-align:center;background:var(--empty);color:var(--ink2);font-variant-numeric:tabular-nums}
.tag.lmt{background:var(--lmtbg);color:var(--lmt)}.tag.high{background:var(--highbg);color:var(--high)}.tag.medium{background:var(--medbg);color:var(--med)}.tag.comp{background:var(--compbg);color:var(--comp)}
.row .t{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--mute);font-size:14px;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .v{flex:none;color:var(--high);font-weight:700;font-size:15px;padding-top:2px}
.row.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:#c5cbd3}
.foot{padding:16px 18px 24px;color:var(--mute);font-size:14px}
.foot b{color:var(--ink2);font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}

/* stand card */
.card{padding:0 0 24px}
.card .bar{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.back{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px 0 6px;border-radius:10px;font-weight:600;font-size:16px;color:var(--ink2)}
.back:active{background:#f3f5f7}
.card .bar .tag{margin-left:auto;font-size:15px}
.card .st{padding:4px 18px 8px;color:var(--mute);font-size:14px}
.ex{padding:14px 18px 16px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex h2{font:700 20px/1.2 var(--font);margin:0;letter-spacing:-.01em}
.ex .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--empty);color:var(--ink2)}
.pill.high{background:var(--highbg);color:var(--high)}.pill.medium{background:var(--medbg);color:var(--med)}.pill.comp{background:var(--compbg);color:var(--comp)}
.ex .who{color:var(--mute);font-size:14px;margin-top:6px}
.ex .why{margin-top:8px;font-size:16px;line-height:1.45;color:var(--ink)}
.ex .links{display:flex;gap:16px;margin-top:10px;font-size:15px}
.visit{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:16px;color:var(--ink);text-align:left}
.visit .box{width:22px;height:22px;border-radius:7px;border:2px solid #b9c0c8;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.visit.on{background:#e8f6ee;border-color:#bfe3cf;color:var(--high)}
.visit.on .box{background:var(--high);border-color:var(--high)}
details.more{padding:10px 18px 0}
details.more summary{cursor:pointer;color:var(--mute);font-size:15px;list-style:none;padding:8px 0}
details.more summary::-webkit-details-marker{display:none}
details.more .ex{padding-left:0;padding-right:0}

/* desktop: sidebar */
@media(min-width:801px){
  #map{left:380px}
  .leaflet-control-zoom{display:block}
  #top{left:auto;right:16px;top:16px;width:360px;display:none}
  #sheet{top:0;left:0;right:auto;width:380px;height:auto!important;border-radius:0;box-shadow:none;border-right:1px solid var(--line);transition:none}
  #grip{display:none}
  #head{padding:18px 20px 10px}
  #dtop{display:flex;flex-direction:column;gap:10px;padding:0 20px 12px}
  #dtop .search{box-shadow:none;border:1.5px solid var(--line)}
  #dtop .chips{flex-wrap:wrap;overflow:visible}
  #dtop .chip{box-shadow:none;border:1.5px solid var(--line);height:34px;font-size:14px;padding:0 11px}
  #dtop .chip.on{border-color:var(--ink)}
  .row:hover{background:#f6f8fa}
}
@media(max-width:800px){#dtop{display:none}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  c.addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;const k=b.dataset.f;active.has(k)?active.delete(k):active.add(k);$$(`.chip[data-f="${k}"]`).forEach(x=>x.classList.toggle('on',active.has(k)));showList();render()})});

  inp.addEventListener('input',()=>{q=inp.value.trim().toLowerCase();$$('.search').forEach(o=>{if(o!==w)o.querySelector('input').value=inp.value;o.classList.toggle('has',!!q)});showList();render()});
  inp.addEventListener('focus',()=>{if(mobile()&&snap==='peek')setSnap('half')});
  x.addEventListener('click',()=>{inp.value='';inp.dispatchEvent(new Event('input'));inp.focus()})});

/* ---------- list ---------- */
const items=[];D.stands.forEach(s=>s.ex.forEach(e=>{if(cls(e))items.push({s,e})}));
items.sort((a,b)=>rank(b.e)-rank(a.e)||a.e.name.localeCompare(b.e.name));
const codeOf=s=>s.code.replace('GV/','').replace('/0/',' · ');
const hit=({s,e})=>!q||[e.name,s.label,s.pav+' '+s.label,e.country,e.cat].some(x=>(x||'').toLowerCase().includes(q));
function render(){const L_=$('#listView');let n=0,h='';
  items.forEach(it=>{const {s,e}=it;const c=cls(e),v=visited.has(String(e.id));
    let ok=active.has(c)||(active.has('visited')&&v);if(active.has('visited')&&!v)ok=false;if(!hit(it))ok=false;if(!ok)return;n++;
    h+=`<div class="row${v?' done':''}${selected===s.code?' sel':''}" data-code="${s.code}" role="button" tabindex="0"><span class="tag ${c}">${s.pav} ${esc(s.label)}</span><div class="t"><div class="nm">${esc(e.name)}</div><div class="sub">${esc(e.country||'')}${e.cat?' · '+esc(e.cat):''}</div></div>${v?'<span class="v">✓</span>':''}</div>`});
  const home=D.stands.find(s=>s.cls==='lmt');
  if(home&&(!q||['lmt','deepvision','f148','strops'].some(k=>k.includes(q)||q.includes(k))))
    h=`<div class="row${selected===home.code?' sel':''}" data-code="${home.code}" role="button" tabindex="0"><span class="tag lmt">${home.pav} ${esc(home.label)}</span><div class="t"><div class="nm">LMT Deepvision stends</div><div class="sub">Mūsu stends (Strops Technologies)</div></div></div>`+h;
  if(!n&&!h)h='<div class="empty">Nekas neatbilst. Noņem filtru vai meklē citādi.</div>';
  const miss=D.missing?.length?`<div class="foot">Bez stenda plānā: <b>${D.missing.map(esc).join(', ')}</b></div>`:'';
  L_.innerHTML=h+miss+`<div class="foot">Atjaunots ${D.generated}. Atzīmes glabājas šajā ierīcē.</div>`;
  $$('#listView .row').forEach(r=>{r.addEventListener('click',()=>select(r.dataset.code,'list'));r.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(r.dataset.code,'list')}})});
  const done=items.filter(({e})=>visited.has(String(e.id))).length;
  $('#meta').textContent=q||active.size!==2||!active.has('high')||!active.has('medium')?`${n} rādīti`:`${items.filter(({e})=>cls(e)!=='comp').length} mērķi · ${done} apmeklēti`}

/* ---------- card ---------- */
function card(s){const ex=[...s.ex].sort((a,b)=>rank(b)-rank(a));const top=ex.filter(e=>cls(e)),rest=ex.filter(e=>!cls(e));
  const one=e=>{const c=cls(e),v=visited.has(String(e.id));
    return `<div class="ex"><h2>${esc(e.name)}</h2>${c?`<div class="pills">${FIT[e.fit]?`<span class="pill ${e.fit}">${FIT[e.fit]}</span>`:''}${e.comp?'<span class="pill comp">Konkurents (LMT)</span>':''}</div>`:''}
    ${e.country||e.cat?`<div class="who">${esc(e.country||'')}${e.country&&e.cat?' · ':''}${esc(e.cat||'')}</div>`:''}
    ${e.why?`<div class="why">${esc(e.why)}</div>`:''}
    <div class="links">${e.web?`<a href="${esc(e.web)}" target="_blank" rel="noopener">Mājaslapa</a>`:''}<a href="https://ecatalogue.firabarcelona.com/175/smartcityexpo2026/exhibitor/${e.id}/detail" target="_blank" rel="noopener">Katalogā</a></div>
    ${c?`<button type="button" class="visit${v?' on':''}" data-v="${e.id}"><span class="box">${v?'✓':''}</span>${v?'Apmeklēts':'Atzīmēt kā apmeklētu'}</button>`:''}</div>`};
  const shown=top.length?top:rest.slice(0,3),hidden=top.length?rest:rest.slice(3);
  let h=`<div class="card"><div class="bar"><button type="button" class="back" id="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Saraksts</button><span class="tag ${s.cls==='empty'?'':s.cls}">${s.pav} ${esc(s.label)}</span></div>
  ${s.cls==='lmt'?'<div class="st" style="color:var(--lmt);font-weight:700">LMT Deepvision stends</div>':''}<div class="st">Stends ${esc(codeOf(s))}${s.ex.length>1?` · ${s.ex.length} dalībnieki`:''}</div>`;
  h+=shown.length?shown.map(one).join(''):'<div class="ex"><div class="who">Stendam vēl nav piešķirts dalībnieks.</div></div>';
  if(hidden.length)h+=`<details class="more"><summary>Vēl ${hidden.length} dalībnieki šajā stendā</summary>${hidden.map(one).join('')}</details>`;
  const cv=$('#cardView');cv.innerHTML=h+'</div>';cv.scrollTop=0;
  $('#back').addEventListener('click',()=>{selected=null;restyle();showList();render()});
  cv.querySelectorAll('.visit').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.v;visited.has(id)?visited.delete(id):visited.add(id);store.set('lmt_visited',[...visited]);restyle();card(s)}))}
function showList(){$('#cardView').hidden=true;$('#listView').hidden=false}
function showCard(){$('#listView').hidden=true;$('#cardView').hidden=false}

/* ---------- select ---------- */
function select(code,from){const s=D.stands.find(x=>x.code===code);if(!s)return;selected=code;restyle();card(s);showCard();
  if(mobile()&&snap==='peek')setSnap('half');if(mobile()&&snap==='full')setSnap('half');
  const b=layers[code].getBounds();const pad=mobile()?{paddingTopLeft:[24,120],paddingBottomRight:[24,heights()[mobile()?snap==='full'?'half':snap:'half']+24]}:{padding:[80,80]};
  setTimeout(()=>{map.flyToBounds(b,{maxZoom:from==='map'?Math.max(map.getZoom(),19.5):20,duration:.6,...pad})},mobile()?120:0)}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&selected){selected=null;restyle();showList();render()}});
map.on('click',()=>{if(mobile()&&snap==='full')setSnap('half')});

render();setSnap('half');
requestAnimationFrame(()=>{setSnap('half');fitAll();showLabels()});
</script></body></html>
